<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axial engineers - Interactive Catalog</title>
    
    <!-- dFlip CSS -->
    <link href="https://unpkg.com/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://unpkg.com/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        /* Strict Reset */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #e9ecef; /* Clean, professional light gray */
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Rigid container to force 100% height calculation */
        .booklet-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* Targeting the dFlip container directly */
        ._df_book {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
        
        /* Ensure the internal canvas expands */
        .df-container {
            width: 100% !important;
            height: 100% !important;
        }

        /* --- NEW: Fix for tiny UI Buttons --- */
        .df-ui-btn {
            font-size: 20px !important; /* Increases the icon size */
            padding: 12px !important;   /* Increases the clickable area */
            min-width: 45px !important; 
            min-height: 45px !important;
        }
        
        /* Ensure the control bar is tall enough to fit the bigger buttons */
        .df-ui-controls {
            height: auto !important;
            padding: 10px 0 !important;
        }
    </style>
</head>
<body>
    
    <!-- Wrapper ensures the library always has a 100% height reference -->
    <div class="booklet-wrapper">
        <div class="_df_book" source="Untitled design (2).pdf" id="df_manual_book"></div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- dFlip Setup -->
    <script>
        var dFlipLocation = "https://unpkg.com/dflip/";
    </script>
    <script src="https://unpkg.com/dflip/js/dflip.min.js"></script>
    
</body>
</html>
